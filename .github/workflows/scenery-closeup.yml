name: Scenery close-up
on:
  push:
    branches: ['qa/scenery-closeup']
    paths: ['.github/workflows/scenery-closeup.yml', '.github/qa/capture_props.gd']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb libgl1
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-4.7.2-stable-mono-linux
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q g.zip && rm g.zip
      - run: dotnet build game/Cloverbrook.Game.csproj -warnaserror
      - run: |
          G=$(ls ~/godot/Godot_*/Godot_*.x86_64)
          "$G" --headless --import --path game
          mkdir -p evidence
          set -o pipefail
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" "$G" --path game --rendering-driver vulkan --resolution 1280x720 --script "$PWD/.github/qa/capture_props.gd" 2>&1 | tee evidence/capture.log
          P=$(sed -n 's/^PROP_CAPTURE_SAVED://p' evidence/capture.log)
          test -f "$P"
          cp "$P" evidence/props-closeup.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenery-closeup
          path: evidence/
          retention-days: 7
