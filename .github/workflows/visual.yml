name: visual

# Builds the Godot game, prepares the CC0 adult and foal, boots the
# main scene, renders headless evidence (Xvfb + Mesa lavapipe Vulkan) and uploads
# contact sheets. Tool versions are pinned here and in docs/visual/TOOLCHAIN.md.

on:
  push:
    paths: ['game/**', 'tools/**', 'src/**', 'art/reference/Horse_Reference/**', '.github/workflows/visual.yml']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable
  BPY_VERSION: 5.2.2
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/visual/requirements.txt

      - name: Export reference descriptors from the domain and check for drift
        run: |
          dotnet test Cloverbrook.sln --configuration Release --filter "FullyQualifiedName~VisualDescriptorFixtureTests"
          fresh=$(find tests -path '*TestResults/visual-descriptor-fixtures.json' | head -1)
          if ! cmp -s "$fresh" game/data/fixtures/visual-descriptor-fixtures.json; then
            echo "::warning::Domain descriptor export differs from game/data/fixtures; using the fresh export for this run."
            cp "$fresh" game/data/fixtures/visual-descriptor-fixtures.json
          fi

      - name: Install Blender (bpy) and image tools
        run: pip install -r tools/visual/requirements.txt

      - name: Rebuild placeholder horse from source
        run: python tools/horse/build_horse.py --out game/assets/horse/placeholder

      - name: Prepare CC0 reference adult and foal for procedural coats
        run: python tools/horse/import_reference.py

      - name: Install Mesa Vulkan (lavapipe) and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb libgl1

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q g.zip && rm g.zip

      - name: Build game C#
        run: dotnet build game/Cloverbrook.Game.csproj -warnaserror

      - name: Import project
        run: |
          G=$(ls ~/godot/Godot_*/Godot_*.x86_64)
          echo "G=$G" >> $GITHUB_ENV
          $G --headless --import --path game

      - name: Verify pinned Stock and foal import proofs
        run: |
          python3 -m unittest discover -s tools/horse -p 'test_*walk*.py'
          mkdir -p evidence/walk-import
          for family in stock foal; do
            "$G" --headless --path game --script "$PWD/tools/horse/check_imported_walk.gd" -- \
              "res://assets/horse/production/horse_${family}_walk.glb" \
              "$PWD/evidence/walk-import/${family}.json" \
              "res://assets/horse/production/evidence/${family}-walk-anatomy/walk-motion-profile.json" --imported
          done
          "$G" --headless --path game --script "$PWD/tools/horse/check_imported_foal_hind.gd" -- \
            "res://assets/horse/production/horse_foal_walk.glb" \
            "$PWD/evidence/walk-import/foal-hind.json"
          "$G" --headless --path game --script "$PWD/tools/horse/check_imported_foal_idle.gd" -- \
            "res://assets/horse/production/horse_foal.glb" \
            "$PWD/evidence/walk-import/foal-idle.json" \
            "res://assets/horse/production/evidence/foal-idle-hind-geometry/idle-import-profile.json" --imported
          "$G" --headless --path game res://scenes/tools/FoalTransitionProbe.tscn -- \
            --out="$PWD/evidence/foal-transitions"

      - name: Smoke test main scene (checked family Walk, coats, and viewer controls)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          mkdir -p evidence/walk-integration
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" $G --path game --rendering-driver vulkan --resolution 1280x720 -- --smoke-test --walk-evidence="$PWD/evidence/walk-integration" 2>&1 | tee evidence/walk-integration/smoke.log
          grep -q "\[smoke\] OK all four family mappings" evidence/walk-integration/smoke.log

      - name: Verify stable review, End Day, and saved reload
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          mkdir -p evidence/stable-day
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" $G --path game --rendering-driver vulkan --resolution 1280x720 res://scenes/stable_day.tscn -- --stable-day-capture="$PWD/evidence/stable-day" --save-path="$RUNNER_TEMP/stable-day/stable.clvr" 2>&1 | tee evidence/stable-day/capture.log
          grep -q "\[stable-day-capture\] OK" evidence/stable-day/capture.log

      - name: Verify committed birth, naming, growth, and saved reload
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          mkdir -p evidence/stable-lifecycle
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" $G --path game --rendering-driver vulkan --resolution 1280x720 res://scenes/stable_day.tscn -- --stable-lifecycle-capture="$PWD/evidence/stable-lifecycle" --save-path="$RUNNER_TEMP/stable-lifecycle/stable.clvr" 2>&1 | tee evidence/stable-lifecycle/capture.log
          grep -q "\[stable-lifecycle-capture\] OK" evidence/stable-lifecycle/capture.log

      - name: Verify normal saved-stable breeding, birth, naming, and growth
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          mkdir -p evidence
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" $G --path game --rendering-driver vulkan --resolution 1280x720 res://scenes/stable_day.tscn -- --stable-breeding-capture="$PWD/evidence/stable-breeding" --save-path="$RUNNER_TEMP/stable-breeding/stable.clvr" 2>&1 | tee evidence/stable-breeding-capture.log
          grep -q "\[stable-breeding-capture\] OK" evidence/stable-breeding-capture.log
          cp evidence/stable-breeding-capture.log evidence/stable-breeding/capture.log

      - name: Render evidence
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          mkdir -p evidence
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" $G --path game --rendering-driver vulkan --resolution 1280x720 res://scenes/capture.tscn -- --out "$PWD/evidence" --sets clay,sheet,detail,appearance,markings,turntable,pair,stable,anim,probes,foal_idle 2>&1 | tee evidence/capture.log
          test -f evidence/capture_report.json

      - name: Contact sheets and summary
        if: always()
        run: |
          python tools/visual/contact_sheets.py evidence || true
          cp game/assets/horse/placeholder/*.manifest.json evidence/ || true
          cp game/assets/horse/reference/*.manifest.json evidence/ || true
          cat evidence/SUMMARY.md >> $GITHUB_STEP_SUMMARY || echo "No summary produced" >> $GITHUB_STEP_SUMMARY
          python3 -c "import json,sys; r=json.load(open('evidence/capture_report.json')); sys.exit(1 if r['failures'] else 0)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: evidence/
          retention-days: 30
