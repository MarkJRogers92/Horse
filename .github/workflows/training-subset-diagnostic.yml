name: Training material culling isolation
on:
  push:
    branches: ['codex/practice-training-props']
    paths: ['.github/workflows/training-subset-diagnostic.yml']
permissions:
  contents: read
jobs:
  subset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        culling: [original, backface]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select barrel material contrast in ephemeral checkout
        env:
          CULLING: ${{ matrix.culling }}
        run: |
          python3 - <<'PY'
          import json, os, struct
          p = 'game/scripts/Stable/StableYard.Training.cs'
          s = open(p).read()
          lines = [line for line in s.splitlines(True) if 'PlaceTrainingProp("' not in line or '"training_barrel"' in line]
          open(p, 'w').writelines(lines)
          # Change only material culling in this disposable checkout. Geometry,
          # vertex attributes, materials, importer and scene lifecycle stay fixed.
          p = 'game/assets/scenery/training_barrel/training_barrel.glb'
          data = open(p, 'rb').read()
          length = struct.unpack_from('<I', data, 12)[0]
          doc = json.loads(data[20:20 + length])
          if os.environ['CULLING'] == 'backface':
              for material in doc['materials']:
                  material['doubleSided'] = False
              payload = json.dumps(doc, separators=(',', ':')).encode()
              payload += b' ' * (-len(payload) % 4)
              tail = data[20 + length:]
              result = struct.pack('<4sII', b'glTF', 2, 20 + len(payload) + len(tail)) + struct.pack('<I4s', len(payload), b'JSON') + payload + tail
              open(p, 'wb').write(result)
          print('Barrel material culling:', os.environ['CULLING'])
          PY
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb libgl1
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-4.7.2-stable-mono-linux
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q g.zip && rm g.zip
      - name: Run ordinary cold gallery and preserve exit status
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          G=$(ls ~/godot/Godot_*/Godot_*.x86_64)
          mkdir -p evidence/subset
          dotnet build game/Cloverbrook.Game.csproj -warnaserror
          "$G" --headless --import --path game > evidence/subset/import.log 2>&1
          set +e
          timeout 180 xvfb-run -a -s '-screen 0 1280x720x24' "$G" --path game --rendering-driver vulkan --resolution 1280x720 --script "$PWD/tools/portraits/check_gallery.gd" -- --out="$PWD/evidence/subset" > evidence/subset/gallery.log 2>&1
          code=$?
          cat evidence/subset/gallery.log
          printf 'GALLERY_PROCESS_EXIT=%s\n' "$code" | tee evidence/subset/exit.txt
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-culling-${{ matrix.culling }}-${{ matrix.repeat }}
          path: evidence/subset/
          retention-days: 14
